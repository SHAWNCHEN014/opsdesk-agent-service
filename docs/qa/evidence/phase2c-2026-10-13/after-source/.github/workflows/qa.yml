name: Offline quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install offline QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run required quality gate
        run: python scripts/qa/run_checks.py --output artifacts/qa/ci
      - name: Preserve synthetic quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-quality-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/qa/ci/junit.xml
            artifacts/qa/ci/summary.json
            artifacts/qa/ci/quality-report.md
            artifacts/qa/ci/coverage.json
            artifacts/qa/ci/coverage.xml
            artifacts/qa/ci/coverage.txt
            artifacts/qa/ci/evaluation.json
            artifacts/qa/ci/pytest-output.txt
